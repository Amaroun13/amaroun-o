name: Build and Push Fedora Atomic Image
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bootc image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/amaroun13/amaroun-o:latest
            ghcr.io/amaroun13/amaroun-o:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=amaroun-o
            org.opencontainers.image.description=Fedora Atomic bootc image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          secrets: |
            secureboot_key=${{ secrets.SECUREBOOT_KEY }}
            secureboot_cert=${{ secrets.SECUREBOOT_CERT }}
          provenance: false
          sbom: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published image
        env:
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify published image signature
        env:
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp \
              "^${{ github.server_url }}/${{ github.repository }}/.github/workflows/build.yml@refs/heads/main$" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
